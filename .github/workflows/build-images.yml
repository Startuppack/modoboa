name: Build and push Docker images

# Construit les images de production de Modoboa (backend + frontend) et les
# pousse sur Harbor.
#
# Configuration (Settings -> Secrets and variables -> Actions) :
#   Secrets   : HARBOR_PASSWORD          (obligatoire)
#               HARBOR_USERNAME          (si pas défini en Variable)
#   Variables : HARBOR_REGISTRY          (déf. public-harbor.gottaphish.com)
#               HARBOR_PROJECT           (déf. startuppack)
#               HARBOR_USERNAME          (déf. startuppack ; sinon secret)

on:
  push:
    branches:
      - master
    paths:
      - 'modoboa/**'
      - 'frontend/**'
      - 'instance/**'
      - 'docker/**'
      - 'pyproject.toml'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Optional image tag to publish
        required: false
        type: string

env:
  REGISTRY: ${{ vars.HARBOR_REGISTRY || 'public-harbor.gottaphish.com' }}
  HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT || 'startuppack' }}

jobs:
  docker:
    name: Build and push (${{ matrix.component }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            image: modoboa
            dockerfile: docker/Dockerfile
          - component: frontend
            image: modoboa-frontend
            dockerfile: docker/Dockerfile.front

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: meta
        shell: bash
        env:
          CUSTOM_TAG: ${{ inputs.tag }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          image="${REGISTRY}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          short_sha="${GITHUB_SHA::7}"
          branch_tag="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          tags="${image}:${short_sha},${image}:${branch_tag}"
          if [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            tags="${tags},${image}:latest"
          fi
          if [[ -n "${CUSTOM_TAG}" ]]; then
            tags="${tags},${image}:${CUSTOM_TAG}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.HARBOR_USERNAME || secrets.HARBOR_USERNAME || 'startuppack' }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
